<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录词屿</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><script src="/login.js" defer></script></head>
<body style="display:block;padding:24px"><main style="max-width:460px;margin:8vh auto"><section class="card"><div class="eyebrow">WORD ISLE · 词屿</div><h1>回到你的单词岛</h1><p>登录后，在不同设备继续学习。每个账号的记录独立保存。</p><form id="login-form"><label class="field">账号<input name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[a-zA-Z0-9][a-zA-Z0-9_-]{2,31}" placeholder="3–32 位字母、数字、下划线或连字符"></label><label class="field">密码<input name="password" type="password" autocomplete="current-password" required minlength="12" maxlength="128" placeholder="至少 12 个字符"></label><label class="field" id="invitation-field" hidden>邀请码<input name="invitation" autocomplete="off" maxlength="128" placeholder="向管理员获取邀请码"></label><p id="login-status" role="status" aria-live="polite"></p><div class="button-row"><button type="submit" class="primary" id="submit-login">登录</button><button type="button" class="secondary" id="toggle-mode">创建账号</button></div></form><p class="ipa-note">请由家长协助注册并妥善保管密码。学习记录和提交的录音保存在云端；录音评测会另行征求同意。暂不支持自助找回密码。</p></section></main></body></html>
